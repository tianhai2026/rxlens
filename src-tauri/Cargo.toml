[package]
name = "rxlens"
version = "4.0.0"
description = "赛博医疗级智能处方扫描与台账管理系统"
authors = ["RxLens Team"]
license = "MIT"
repository = "https://github.com/rxlens/rxlens"
edition = "2021"
rust-version = "1.75"

[lib]
name = "rxlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.0"

# OpenHarmony 实验性适配（待 Tauri 官方支持完善后启用）
# [target.'cfg(target_os = "ohos")'.dependencies]
# ohos-rs = "0.1"
